name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full tag history

      # No registry-url on setup-node: the .npmrc it writes conflicts with
      # semantic-release's npm auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately no NPM_TOKEN: @semantic-release/npm attempts OIDC
          # automatically when it's absent.
